name: test

on:
  push:
  workflow_dispatch:

jobs:
  node-test:
    strategy:
      fail-fast: false
      matrix:
        # engines.node: >=22.19.0 || >=24.0.0
        node: ['22.19.0', '24.x']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --ignore-scripts
      - run: node --test
